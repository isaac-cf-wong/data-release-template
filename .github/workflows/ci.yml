name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]
    workflow_dispatch:
    workflow_call:

permissions:
    contents: read

jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
            - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
              with:
                  python-version: '3.12'
                  enable-cache: true
            - run: uv sync --group dev --upgrade
            - run: uv run --no-sync pytest
            - run:
                  uv run --no-sync python scripts/build_release_archive.py
                  --output-dir dist
