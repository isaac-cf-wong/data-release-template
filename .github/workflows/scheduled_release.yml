name: Scheduled Release

on:
    schedule:
        - cron: '0 0 * * 2'
    workflow_dispatch:

permissions:
    contents: write

jobs:
    release:
        if: vars.ENABLE_SCHEDULED_RELEASE == 'true'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
              with:
                  fetch-depth: 0
            - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
              with:
                  python-version: '3.12'
                  enable-cache: true
            - run: uv sync --group dev --upgrade
            - run: uv run --no-sync pytest
            - name: Check for changes since the latest release
              id: changes
              shell: bash
              run: |
                  set -euo pipefail
                  latest=$(git describe --tags --abbrev=0 2>/dev/null || true)
                  if [[ -n "$latest" ]]; then
                    git diff --quiet "$latest" HEAD && echo "changed=false" >> "$GITHUB_OUTPUT" || echo "changed=true" >> "$GITHUB_OUTPUT"
                  else
                    echo "changed=true" >> "$GITHUB_OUTPUT"
                  fi
            - name: Build archive
              if: steps.changes.outputs.changed == 'true'
              run:
                  uv run --no-sync python scripts/build_release_archive.py
                  --output-dir dist --name "data-release-${GITHUB_SHA::7}"
            - name: Publish GitHub release
              if: steps.changes.outputs.changed == 'true'
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  set -euo pipefail
                  tag="v$(date -u +%Y.%m.%d).${GITHUB_RUN_NUMBER}"
                  gh release create "$tag" dist/* --title "Data release $tag" --generate-notes
