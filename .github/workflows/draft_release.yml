name: Draft Release

on:
    push:
        branches: [main]

permissions:
    contents: write

concurrency:
    group: draft-release
    cancel-in-progress: true

jobs:
    draft-release:
        if: vars.ENABLE_SCHEDULED_RELEASE == 'true'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
              with:
                  fetch-depth: 0
            - name: Generate release notes
              uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4.9.1
              with:
                  config: cliff.toml
                  args: --unreleased --verbose
              env:
                  OUTPUT: RELEASE_NOTES.md
            - name: Delete existing draft release
              continue-on-error: true
              env:
                  GH_TOKEN: ${{ github.token }}
              run: gh release delete next-release --yes
            - name: Create draft release
              env:
                  GH_TOKEN: ${{ github.token }}
              run:
                  gh release create next-release --draft --title 'Next Release
                  (Draft)' --notes-file RELEASE_NOTES.md
